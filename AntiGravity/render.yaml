services:
  - type: web
    name: centaur-whatsapp-bot
    runtime: python
    env: python
    buildCommand: pip install flask==3.0.3 flask-cors==4.0.1 gunicorn==22.0.0 numpy==1.26.4 scikit-learn==1.4.2 google-generativeai==0.7.2 requests==2.32.3 python-dotenv==1.0.1
    startCommand: gunicorn AntiGravity.app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
