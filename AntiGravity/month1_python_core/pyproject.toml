[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "centaur-whatsapp-bot"
version = "1.0.0"
description = "Centaur OS Enterprise WhatsApp Bot & REST API"
dependencies = [
    "flask==3.0.3",
    "flask-cors==4.0.1",
    "gunicorn==22.0.0",
    "scikit-learn==1.4.2",
    "google-generativeai==0.7.2",
    "requests==2.32.3",
    "python-dotenv==1.0.1"
]
