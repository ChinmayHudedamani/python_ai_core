<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Dental Center - WhatsApp AI Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #111b21; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .phone-container { width: 100%; max-width: 480px; height: 100vh; max-height: 850px; background: #0b141a; display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; box-shadow: 0 12px 32px rgba(0,0,0,0.5); }
        .header { background: #202c33; padding: 12px 16px; display: flex; align-items: center; gap: 12px; color: #e9edef; border-bottom: 1px solid #222d34; }
        .avatar { width: 42px; height: 42px; background: #00a884; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: 600; font-size: 18px; color: #fff; }
        .clinic-info { flex: 1; }
        .clinic-name { font-size: 16px; font-weight: 600; color: #e9edef; }
        .status { font-size: 12px; color: #8696a0; display: flex; align-items: center; gap: 4px; }
        .online-dot { width: 8px; height: 8px; background: #00a884; border-radius: 50%; }
        
        .chat-area { flex: 1; background: #0b141a; background-image: radial-gradient(#1f2c34 1px, transparent 0); background-size: 24px 24px; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        
        .message-bubble { max-width: 82%; padding: 8px 12px; border-radius: 8px; font-size: 14.2px; line-height: 1.45; position: relative; word-wrap: break-word; }
        .user-msg { background: #005c4b; color: #e9edef; align-self: flex-end; border-top-right-radius: 2px; }
        .bot-msg { background: #202c33; color: #e9edef; align-self: flex-start; border-top-left-radius: 2px; }
        .msg-time { font-size: 10.5px; color: #8696a0; text-align: right; margin-top: 4px; margin-left: 12px; float: right; }
        .ticks { color: #53bdeb; margin-left: 2px; font-weight: bold; }
        
        .preset-container { padding: 8px 12px; background: #111b21; display: flex; gap: 6px; overflow-x: auto; border-top: 1px solid #222d34; }
        .preset-btn { background: #202c33; color: #00a884; border: 1px solid #00a884; padding: 6px 12px; border-radius: 16px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: 0.2s; }
        .preset-btn:hover { background: #00a884; color: #fff; }
        
        .input-bar { background: #202c33; padding: 10px 12px; display: flex; align-items: center; gap: 8px; border-top: 1px solid #222d34; }
        .input-bar input { flex: 1; background: #2a3942; border: none; padding: 10px 16px; border-radius: 8px; color: #e9edef; font-size: 14px; outline: none; }
        .input-bar input::placeholder { color: #8696a0; }
        .send-btn { background: #00a884; border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; color: #fff; }
        
        .typing-indicator { font-size: 12px; color: #00a884; font-style: italic; display: none; margin-left: 8px; }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="header">
        <div class="avatar">🏥</div>
        <div class="clinic-info">
            <div class="clinic-name">Apex Dental Center ✓</div>
            <div class="status"><span class="online-dot"></span> Official WhatsApp Assistant</div>
        </div>
    </div>

    <div class="chat-area" id="chatArea">
        <div class="message-bubble bot-msg">
            Hello! Welcome to Apex Dental Center & Implant Institute, Koramangala. 🦷<br><br>
            I am your AI Clinical Assistant. You can ask me about Invisalign clear aligners, dental implants, root canal treatments, or book an appointment.
            <div class="msg-time">09:00 AM</div>
        </div>
    </div>

    <div class="preset-container">
        <button class="preset-btn" onclick="sendPreset('How much do Invisalign clear aligners cost?')">💰 Invisalign Cost</button>
        <button class="preset-btn" onclick="sendPreset('How much do metal braces cost?')">😬 Braces Cost</button>
        <button class="preset-btn" onclick="sendPreset('I want to book an appointment for Saturday at 11 AM')">📅 Book Saturday 11 AM</button>
        <button class="preset-btn" onclick="sendPreset('1')">✅ Confirm '1'</button>
    </div>

    <div class="input-bar">
        <input type="text" id="userInput" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
    </div>
</div>

<script>
    function getTime() {
        const now = new Date();
        return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function sendPreset(text) {
        document.getElementById("userInput").value = text;
        sendMessage();
    }

    function handleKeyPress(e) {
        if (e.key === "Enter") sendMessage();
    }

    async function sendMessage() {
        const input = document.getElementById("userInput");
        const text = input.value.strip ? input.value.strip() : input.value.trim();
        if (!text) return;

        const chatArea = document.getElementById("chatArea");

        // Append User Message
        const userBubble = document.createElement("div");
        userBubble.className = "message-bubble user-msg";
        userBubble.innerHTML = `${text} <div class="msg-time">${getTime()} <span class="ticks">✓✓</span></div>`;
        chatArea.appendChild(userBubble);
        input.value = "";
        chatArea.scrollTop = chatArea.scrollHeight;

        // Show Typing Indicator
        const typingBubble = document.createElement("div");
        typingBubble.className = "message-bubble bot-msg";
        typingBubble.id = "typingBubble";
        typingBubble.innerHTML = `<span class="typing-indicator" style="display:inline;">Apex Dental is typing...</span>`;
        chatArea.appendChild(typingBubble);
        chatArea.scrollTop = chatArea.scrollHeight;

        try {
            const response = await fetch("/api/v1/intake", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    notes: text,
                    name: "Ananya Roy",
                    phone: "+91-9988776655"
                })
            });
            const data = await response.json();
            
            // Remove typing bubble
            const tb = document.getElementById("typingBubble");
            if (tb) tb.remove();

            // Append Bot Response
            const botBubble = document.createElement("div");
            botBubble.className = "message-bubble bot-msg";
            const replyText = (data.whatsapp_response || "Thank you for contacting Apex Dental Center.").replace(/\n/g, "<br>");
            botBubble.innerHTML = `${replyText} <div class="msg-time">${getTime()}</div>`;
            chatArea.appendChild(botBubble);
            chatArea.scrollTop = chatArea.scrollHeight;

        } catch (err) {
            const tb = document.getElementById("typingBubble");
            if (tb) tb.remove();

            const botBubble = document.createElement("div");
            botBubble.className = "message-bubble bot-msg";
            botBubble.innerHTML = `Thank you for contacting Apex Dental Center. Doctor: Dr. Chinmay Hudedamani. Contact: +91-9988776655. <div class="msg-time">${getTime()}</div>`;
            chatArea.appendChild(botBubble);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
    }
</script>
</body>
</html>
